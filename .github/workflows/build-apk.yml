name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        run: |
        echo "android.useAndroidX=true">
        gradle.properties
          mkdir -p app/src/main/java/com/coolmassaru/myschedule
          mkdir -p app/src/main/res/values

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/coolmassaru/myschedule/MainActivity.java
          cp ReminderReceiver.java app/src/main/java/com/coolmassaru/myschedule/ReminderReceiver.java
          cp strings.xml app/src/main/res/values/strings.xml
          cp themes.xml app/src/main/res/values/themes.xml

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.coolmassaru.myschedule'
              compileSdk 35

              defaultConfig {
                  applicationId "com.coolmassaru.myschedule"
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-schedule-app-v2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
